<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему дежурств</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-lg border-t-8 border-[#c8102e] w-full max-w-sm">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Вход в систему</h1>
        {% if error %}
        <div class="bg-red-50 text-red-600 p-3 rounded mb-4 text-sm">{{ error }}</div>
        {% endif %}
        <form method="post" action="/login" class="space-y-4">
            <div>
                <label class="block text-xs uppercase font-bold text-gray-600 mb-1">Логин</label>
                <input type="text" name="username" required class="w-full border rounded p-2.5 outline-none focus:border-[#c8102e]">
            </div>
            <div>
                <label class="block text-xs uppercase font-bold text-gray-600 mb-1">Пароль</label>
                <input type="password" name="password" required class="w-full border rounded p-2.5 outline-none focus:border-[#c8102e]">
            </div>
            <button type="submit" class="w-full bg-[#c8102e] hover:bg-[#9b0d23] text-white font-bold py-2.5 rounded transition">
                Войти
            </button>
        </form>
        <p class="text-xs text-gray-400 mt-4 text-center">Администратор: admin / admin123<br>Сотрудник: user / user123</p>
    </div>
</body>
</html>
